name: Mirror from Gitee

# Gitee is the primary development platform for this project; GitHub is its public
# mirror. Both repositories carry the same name (`chrome-dozetabs`). The GITEE_REPO
# slug below is the Gitee side of that pair and **must be updated on any rename** —
# otherwise this sync keeps working through a 302 redirect of the old name, which
# hides the mistake instead of surfacing it. Gitee's own mirror feature would need
# an account binding, so the sync runs here instead, on a schedule.
#
# Note: refs pushed with the workflow's own GITHUB_TOKEN do NOT trigger other
# workflows (GitHub suppresses that to avoid recursion), so this job runs the
# checks itself rather than expecting ci.yml to fire afterwards.

on:
  schedule:
    - cron: '17 */6 * * *' # every six hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

env:
  GITEE_REPO: xplugins/chrome-dozetabs
  # Ground truth for `tool/validate.js`'s branch-name check — see the comment in
  # ci.yml. This job also runs `npm run check`, so it needs the same value.
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  mirror:
    name: sync refs, then verify
    runs-on: ubuntu-latest

    steps:
      - name: Mirror Gitee refs onto GitHub
        env:
          # Set a GITEE_TOKEN secret only if the Gitee repository is private.
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${GITEE_TOKEN:-}" ]; then
            SOURCE="https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          else
            SOURCE="https://gitee.com/${GITEE_REPO}.git"
          fi

          git clone --mirror "$SOURCE" source.git
          cd source.git

          echo "Source refs:"
          git for-each-ref --format='  %(refname) %(objectname:short)' refs/heads refs/tags

          DEST="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          echo
          echo "Checking whether GitHub is ahead of Gitee..."
          git fetch --quiet "$DEST" '+refs/heads/*:refs/from-github/*' || true
          behind=0
          for ref in $(git for-each-ref --format='%(refname)' refs/heads); do
            branch=${ref#refs/heads/}
            remote_ref="refs/from-github/$branch"
            if git rev-parse --verify --quiet "$remote_ref" >/dev/null; then
              if ! git merge-base --is-ancestor "$remote_ref" "$ref"; then
                echo "::warning::$branch on GitHub has commits Gitee does not"
                behind=1
              fi
            fi
          done
          if [ "$behind" = "1" ]; then
            echo "::warning::GitHub is ahead. The sync below is fast-forward-only and will"
            echo "::warning::be rejected rather than rewind GitHub. Push your Gitee remote first:"
            echo "::warning::    git push origin <branch>"
          fi

          # Deliberately NOT `git push --mirror`. --mirror force-updates every ref,
          # so a Gitee checkout that is behind would silently REWIND GitHub and lose
          # the newer commits. Pushing without force turns that into a loud failure.
          git push "$DEST" "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"

      - name: Check out the freshly mirrored revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full check
        run: npm run check

      - name: Build the store package
        run: npm run build

      - name: Verify the archive layout
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip)
          unzip -p "$ZIP" manifest.json > /dev/null
          if unzip -l "$ZIP" | grep -qE '[^/]+/manifest\.json'; then
            echo "::error::manifest.json must sit at the archive root"
            exit 1
          fi
          echo "package ok: $ZIP"
